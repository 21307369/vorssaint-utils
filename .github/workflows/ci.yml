name: CI

on:
  push:
    branches: [main, 'tweak/**']

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & selftest
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./Tools/ci-setup-signing.sh

      - name: Unit tests
        run: ./build.sh --test

      - name: Build arm64
        run: TARGET="arm64-apple-macosx14.0" ./build.sh
      - name: Save arm64 binaries
        run: |
          mkdir -p dist/arm64
          cp build/Vorssaint dist/arm64/
          cp build/FanControlHelper dist/arm64/ 2>/dev/null || true
      - name: Build x86_64
        run: TARGET="x86_64-apple-macosx14.0" ./build.sh
      - name: Create universal binary
        run: |
          lipo -create dist/arm64/Vorssaint build/Vorssaint -output build/Vorssaint
          if [[ -f dist/arm64/FanControlHelper ]]; then
            lipo -create dist/arm64/FanControlHelper build/FanControlHelper -output build/FanControlHelper
          fi
      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vorssaint-dmg
          path: dist/*.dmg
          if-no-files-found: error
